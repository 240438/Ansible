---
- name: Wait for some time to ensure system readiness
  hosts: all
  tasks:
  - name: Wait 300 seconds for port 22 to become open and contain "OpenSSH"
    wait_for:
      port: 22
      host: "{{ inventory_hostname }}"
      delay: 10
      timeout: 300
    delegate_to: localhost

- name: Configure Docker
  hosts: all
  become: true
  tasks:
  - name: install docker and update cache
    yum:
      name: docker
      state: present
      update_cache: yes

- name: Install Docker Compose
  hosts: all
  become: true
  tasks:
  - name: create docker cli-plugins directory
    file:
      path: /usr/local/lib/docker/cli-plugins
      state: directory
      mode: '0755'
  
  - name: install docker-compose
    get_url:
      url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
      dest: /usr/local/lib/docker/cli-plugins/docker-compose
      mode: '0755'
  
  - name: restart docker service
    service:
      name: docker
      state: restarted
  
- name: Adding user to docker group
  hosts: all
  become: true
  vars_files:
    - project-vars.yaml
  tasks:
  - name: add user to docker group
    user:
      name: "{{ normal_user }}"
      groups: docker
      append: yes
  
  - name: reconnect to apply group changes
    meta: reset_connection
  
  - name: verify docker access
    command: docker ps
    register: docker_ps
    changed_when: false
  
  - name: display docker ps output
    debug:
      var: docker_ps.stdout

  - name: fail if docker is not accessible
    fail:
      msg: "Docker is not accessible on this host"
    when: docker_ps.rc != 0

- name: Deploy Docker Containers
  hosts: all
  become: true
  user: "{{ normal_user }}"
  vars_files:
    - project-vars.yaml
  tasks:
  - name: check if docker-compose file exists
    stat: 
      path: /home/{{ normal_user }}/compose.yaml
    register: compose_file

  - name: copy docker-compose file
    copy:
      src: "{{ docker_compose_file_location }}/compose.yaml"
      dest: /home/{{ normal_user }}/compose.yaml
      mode: '0644'
    when: not compose_file.stat.exists
  
  - name: deploy containers using docker-compose
    command: docker compose up -d
